name: Build and Deploy

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit pandas plotly openpyxl pyinstaller
        pip install protobuf

    - name: List installed packages
      run: pip list

    - name: Build executable
      run: |
        pyinstaller --name="Excel分析器" --onefile --hidden-import=streamlit --hidden-import=streamlit.runtime.scriptrunner --hidden-import=streamlit.runtime.runtime --hidden-import=streamlit.runtime.caching --hidden-import=streamlit.runtime.metrics --hidden-import=streamlit.runtime.secrets --collect-all streamlit main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Excel分析器
        path: dist/Excel.exe
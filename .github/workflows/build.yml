name: Build and Deploy

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit==1.29.0
        pip install pandas==1.5.3
        pip install plotly==5.18.0
        pip install numpy==1.24.3
        pip install openpyxl==3.1.2
        pip install pyinstaller
        pip install requests

    - name: Create launcher script
      run: |
        echo 'import os
        import sys
        import subprocess
        import webbrowser
        import time
        import requests
        import socket
        
        def is_port_in_use(port):
            with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                return s.connect_ex(("localhost", port)) == 0
        
        def wait_for_streamlit(port=8501, timeout=30):
            """等待 Streamlit 服务就绪"""
            start_time = time.time()
            while True:
                if time.time() - start_time > timeout:
                    return False
                try:
                    response = requests.get(f"http://localhost:{port}/healthz")
                    if response.status_code == 200:
                        return True
                except:
                    time.sleep(1)
                    continue
        
        def run_streamlit():
            try:
                # 检查端口是否被占用
                if is_port_in_use(8501):
                    print("端口 8501 已被占用，尝试打开现有页面...")
                    webbrowser.open("http://localhost:8501")
                    return None
                
                # 获取应用路径
                if getattr(sys, "frozen", False):
                    app_dir = os.path.dirname(sys.executable)
                    script_path = os.path.join(app_dir, "main.py")
                else:
                    script_path = "main.py"
                
                # 设置环境变量
                os.environ["STREAMLIT_SERVER_PORT"] = "8501"
                os.environ["STREAMLIT_SERVER_ADDRESS"] = "localhost"
                os.environ["STREAMLIT_SERVER_HEADLESS"] = "true"
                os.environ["STREAMLIT_BROWSER_GATHER_USAGE_STATS"] = "false"
                os.environ["STREAMLIT_BROWSER_SERVER_PORT"] = "8501"
                
                # 启动 Streamlit
                cmd = [
                    sys.executable,
                    "-m", "streamlit",
                    "run",
                    script_path,
                    "--server.port=8501",
                    "--server.address=localhost",
                    "--server.headless=true",
                    "--browser.gatherUsageStats=false",
                    "--browser.serverPort=8501",
                    "--server.runOnSave=false"
                ]
                
                # 启动进程
                process = subprocess.Popen(
                    cmd,
                    stdout=subprocess.PIPE,
                    stderr=subprocess.PIPE,
                    creationflags=subprocess.CREATE_NO_WINDOW
                )
                
                print("正在启动服务...")
                
                # 等待服务就绪
                if wait_for_streamlit():
                    print("服务已就绪")
                    # 打开浏览器
                    webbrowser.open("http://localhost:8501", new=0, autoraise=True)
                    return process
                else:
                    print("服务启动超时")
                    if process:
                        process.terminate()
                    return None
                
            except Exception as e:
                print(f"启动失败: {str(e)}")
                return None
        
        if __name__ == "__main__":
            try:
                print("正在启动应用...")
                process = run_streamlit()
                if process:
                    print("应用已启动，请在浏览器中查看")
                    try:
                        process.wait()
                    except KeyboardInterrupt:
                        process.terminate()
                        print("应用已关闭")
                else:
                    input("按回车键退出...")
            except Exception as e:
                print(f"运行时错误: {str(e)}")
                input("按回车键退出...")' > launcher.py

    - name: Create Streamlit config
      run: |
        mkdir .streamlit
        echo '[server]
        enableCORS = true
        enableXsrfProtection = true
        headless = true
        address = "localhost"
        port = 8501
        maxUploadSize = 200
        runOnSave = false
        
        [browser]
        serverAddress = "localhost"
        serverPort = 8501
        gatherUsageStats = false
        
        [theme]
        primaryColor = "#F63366"
        backgroundColor = "#FFFFFF"
        secondaryBackgroundColor = "#F0F2F6"
        textColor = "#262730"
        font = "sans serif"
        
        [runner]
        magicEnabled = false
        
        [client]
        showErrorDetails = true
        toolbarMode = "minimal"
        
        [logger]
        level = "error"' > .streamlit/config.toml

    - name: Build executable
      run: |
        pyinstaller --name="analysis" `
          --onefile `
          --add-data "main.py;." `
          --add-data ".streamlit/config.toml;.streamlit" `
          --hidden-import=streamlit `
          --hidden-import=streamlit.runtime.scriptrunner `
          --hidden-import=streamlit.runtime.runtime `
          --hidden-import=streamlit.runtime.caching `
          --hidden-import=streamlit.runtime.metrics `
          --hidden-import=streamlit.runtime.secrets `
          --hidden-import=plotly `
          --hidden-import=numpy `
          --hidden-import=pandas `
          --hidden-import=requests `
          --collect-all streamlit `
          --collect-all plotly `
          --noconsole `
          launcher.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: analysis
        path: dist/analysis.exe
        if-no-files-found: error
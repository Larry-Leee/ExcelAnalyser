name: Build and Deploy

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit==1.29.0
        pip install pandas==1.5.3
        pip install plotly==5.18.0
        pip install numpy==1.24.3
        pip install openpyxl==3.1.2
        pip install pyinstaller

    - name: Create launcher script
      run: |
        echo 'import os
        import sys
        import subprocess
        import webbrowser
        import time
        import logging
        from pathlib import Path
        
        def setup_logging():
            log_file = Path("app.log")
            logging.basicConfig(
                level=logging.INFO,
                format="%(asctime)s [%(levelname)s] %(message)s",
                handlers=[
                    logging.FileHandler(log_file),
                    logging.StreamHandler()
                ]
            )
        
        def run_app():
            try:
                # 获取应用路径
                if getattr(sys, "frozen", False):
                    app_dir = Path(sys._MEIPASS)
                else:
                    app_dir = Path(__file__).parent
        
                # 找到主程序
                main_script = app_dir / "main.py"
                if not main_script.exists():
                    logging.error(f"找不到主程序: {main_script}")
                    return False
        
                # 直接运行 Python 解释器
                python_exe = sys.executable
                cmd = [python_exe, "-m", "streamlit", "run", str(main_script),
                      "--server.address=localhost",
                      "--server.port=8501",
                      "--server.headless=true"]
        
                logging.info(f"运行命令: {" ".join(cmd)}")
                
                # 启动进程
                process = subprocess.Popen(
                    cmd,
                    stdout=subprocess.PIPE,
                    stderr=subprocess.PIPE,
                    creationflags=subprocess.CREATE_NO_WINDOW
                )
        
                # 等待服务启动
                time.sleep(3)
                
                # 打开浏览器
                webbrowser.open("http://localhost:8501")
                
                return process
        
            except Exception as e:
                logging.error(f"启动失败: {str(e)}")
                return False
        
        if __name__ == "__main__":
            setup_logging()
            logging.info("启动应用...")
            
            try:
                process = run_app()
                if process:
                    process.wait()
                else:
                    input("启动失败。按回车键退出...")
            except KeyboardInterrupt:
                logging.info("程序被用户中断")
            except Exception as e:
                logging.error(f"运行时错误: {str(e)}")
                input("发生错误。按回车键退出...")' > launcher.py

    - name: Build executable
      run: |
        pyinstaller --name="Analysis" `
          --onefile `
          --add-data "main.py;." `
          --add-data ".streamlit;.streamlit" `
          --hidden-import=streamlit `
          --hidden-import=streamlit.runtime.scriptrunner `
          --hidden-import=streamlit.runtime.runtime `
          --hidden-import=streamlit.runtime.caching `
          --hidden-import=streamlit.runtime.metrics `
          --hidden-import=streamlit.runtime.secrets `
          --hidden-import=plotly `
          --hidden-import=numpy `
          --hidden-import=pandas `
          --collect-all streamlit `
          --collect-all plotly `
          --add-binary "$(python -c 'import sys; print(sys.executable)');\." `
          launcher.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Analysis
        path: dist/Analysis.exe
        if-no-files-found: error
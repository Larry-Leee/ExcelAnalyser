name: Build and Deploy

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit==1.29.0
        pip install pandas==1.5.3
        pip install plotly==5.18.0
        pip install numpy==1.24.3
        pip install openpyxl==3.1.2
        pip install pyinstaller

    # 创建启动器脚本
    - name: Create launcher script
      run: |
        echo 'import subprocess
        import webbrowser
        import time
        import os
        import sys
        
        def run_streamlit():
            if getattr(sys, "frozen", False):
                # 如果是打包后的可执行文件
                app_path = os.path.dirname(sys.executable)
                script_path = os.path.join(app_path, "main.py")
            else:
                script_path = "main.py"
        
            # 启动 Streamlit
            process = subprocess.Popen(
                ["streamlit", "run", script_path, "--server.address=localhost", 
                 "--server.port=8501", "--server.headless=true"],
                stdout=subprocess.PIPE,
                stderr=subprocess.PIPE
            )
        
            # 等待服务启动
            time.sleep(2)
            
            # 打开浏览器
            webbrowser.open("http://localhost:8501")
            
            return process
        
        if __name__ == "__main__":
            process = run_streamlit()
            try:
                process.wait()
            except KeyboardInterrupt:
                process.terminate()' > launcher.py

    - name: Create Streamlit config
      run: |
        mkdir .streamlit
        echo '[server]
        enableCORS = true
        enableXsrfProtection = true
        headless = true
        address = "localhost"
        port = 8501
        
        [browser]
        serverAddress = "localhost"
        serverPort = 8501
        gatherUsageStats = false
        
        [theme]
        primaryColor = "#F63366"
        backgroundColor = "#FFFFFF"
        secondaryBackgroundColor = "#F0F2F6"
        textColor = "#262730"
        font = "sans serif"' > .streamlit/config.toml

    - name: Build executable
      run: |
        pyinstaller --name="Analyser" `
          --onefile `
          --add-data "main.py;." `
          --add-data ".streamlit;.streamlit" `
          --hidden-import=streamlit `
          --hidden-import=streamlit.runtime.scriptrunner `
          --hidden-import=streamlit.runtime.runtime `
          --hidden-import=streamlit.runtime.caching `
          --hidden-import=streamlit.runtime.metrics `
          --hidden-import=streamlit.runtime.secrets `
          --hidden-import=plotly `
          --hidden-import=numpy `
          --hidden-import=pandas `
          --collect-all streamlit `
          --collect-all plotly `
          launcher.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExcelAnalysis
        path: dist/Analyser.exe
        if-no-files-found: error
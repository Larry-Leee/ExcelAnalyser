name: Build and Deploy

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit==1.29.0 pandas==2.1.4 plotly==5.18.0 numpy==1.24.3 openpyxl==3.1.2 pyinstaller

    - name: Create Streamlit config
      run: |
        mkdir .streamlit
        echo '[server]
        enableCORS = true
        enableXsrfProtection = true
        
        [browser]
        serverAddress = "localhost"
        serverPort = 8501
        gatherUsageStats = false
        
        [theme]
        primaryColor = "#F63366"
        backgroundColor = "#FFFFFF"
        secondaryBackgroundColor = "#F0F2F6"
        textColor = "#262730"
        font = "sans serif"' > .streamlit/config.toml

    - name: Build executable
      run: |
        pyinstaller --name="ExcelAnalyser" `
          --onefile `
          --add-data ".streamlit;.streamlit" `
          --hidden-import=streamlit `
          --hidden-import=streamlit.runtime.scriptrunner `
          --hidden-import=streamlit.runtime.runtime `
          --hidden-import=streamlit.runtime.caching `
          --hidden-import=streamlit.runtime.metrics `
          --hidden-import=streamlit.runtime.secrets `
          --hidden-import=plotly `
          --hidden-import=numpy `
          --hidden-import=pandas `
          --collect-all streamlit `
          --collect-all plotly `
          main.py

    - name: List build output
      run: dir dist
      shell: cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExcelAnalyser
        path: dist/ExcelAnalyser.exe
        if-no-files-found: error
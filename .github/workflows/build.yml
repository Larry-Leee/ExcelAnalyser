name: Build and Deploy

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit==1.29.0
        pip install pandas==1.5.3
        pip install plotly==5.18.0
        pip install numpy==1.24.3
        pip install openpyxl==3.1.2
        pip install pyinstaller

    # 首先创建 .streamlit 目录和配置
    - name: Create Streamlit config
      run: |
        mkdir .streamlit
        echo '[server]
        enableCORS = true
        enableXsrfProtection = true
        headless = true
        address = "localhost"
        port = 8501
        
        [browser]
        serverAddress = "localhost"
        serverPort = 8501
        gatherUsageStats = false
        
        [theme]
        primaryColor = "#F63366"
        backgroundColor = "#FFFFFF"
        secondaryBackgroundColor = "#F0F2F6"
        textColor = "#262730"
        font = "sans serif"' > .streamlit/config.toml

    # 然后创建启动器脚本
    - name: Create launcher script
      run: |
        echo 'import os
        import sys
        import subprocess
        import webbrowser
        import time
        
        def run_streamlit():
            try:
                # 获取应用路径
                if getattr(sys, "frozen", False):
                    app_dir = os.path.dirname(sys.executable)
                    script_path = os.path.join(app_dir, "main.py")
                else:
                    script_path = "main.py"
                
                # 启动 Streamlit
                cmd = [sys.executable, "-m", "streamlit", "run", script_path,
                      "--server.address=localhost",
                      "--server.port=8501",
                      "--server.headless=true"]
                
                # 启动进程
                process = subprocess.Popen(
                    cmd,
                    stdout=subprocess.PIPE,
                    stderr=subprocess.PIPE,
                    creationflags=subprocess.CREATE_NO_WINDOW
                )
                
                # 等待服务启动
                time.sleep(3)
                
                # 打开浏览器
                webbrowser.open("http://localhost:8501")
                
                return process
            
            except Exception as e:
                print(f"启动失败: {str(e)}")
                return None
        
        if __name__ == "__main__":
            try:
                process = run_streamlit()
                if process:
                    process.wait()
                else:
                    input("启动失败。按回车键退出...")
            except KeyboardInterrupt:
                pass
            except Exception as e:
                print(f"运行时错误: {str(e)}")
                input("发生错误。按回车键退出...")' > launcher.py

    # 检查文件是否创建成功
    - name: List files
      run: |
        dir
        dir .streamlit
      shell: cmd

    # 最后构建可执行文件
    - name: Build executable
      run: |
        pyinstaller --name="analysis" `
          --onefile `
          --add-data "main.py;." `
          --add-data ".streamlit/config.toml;.streamlit" `
          --hidden-import=streamlit `
          --hidden-import=streamlit.runtime.scriptrunner `
          --hidden-import=streamlit.runtime.runtime `
          --hidden-import=streamlit.runtime.caching `
          --hidden-import=streamlit.runtime.metrics `
          --hidden-import=streamlit.runtime.secrets `
          --hidden-import=plotly `
          --hidden-import=numpy `
          --hidden-import=pandas `
          --collect-all streamlit `
          --collect-all plotly `
          launcher.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: analysis
        path: dist/analysis.exe
        if-no-files-found: error
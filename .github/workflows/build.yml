name: Build and Deploy

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit==1.29.0
        pip install pandas==1.5.3
        pip install plotly==5.18.0
        pip install numpy==1.24.3
        pip install openpyxl==3.1.2
        pip install pyinstaller

    - name: Create launcher script
      run: |
        echo 'import os
        import sys
        import subprocess
        import webbrowser
        import time
        import socket

        def is_port_in_use(port):
            """检查端口是否被占用"""
            with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                try:
                    s.bind(("localhost", port))
                    return False
                except socket.error:
                    return True

        def run_streamlit():
            try:
                if is_port_in_use(8501):
                    return None
                
                if getattr(sys, "frozen", False):
                    app_dir = os.path.dirname(sys.executable)
                    script_path = os.path.join(app_dir, "main.py")
                else:
                    script_path = "main.py"
                
                cmd = [
                    sys.executable,
                    "-m", "streamlit",
                    "run",
                    script_path,
                    "--server.port=8501",
                    "--server.address=localhost",
                    "--server.headless=true",
                    "--browser.gatherUsageStats=false",
                    "--server.runOnSave=false"
                ]
                
                startupinfo = subprocess.STARTUPINFO()
                startupinfo.dwFlags |= subprocess.STARTF_USESHOWWINDOW
                startupinfo.wShowWindow = subprocess.SW_HIDE
                
                process = subprocess.Popen(
                    cmd,
                    stdout=subprocess.PIPE,
                    stderr=subprocess.PIPE,
                    startupinfo=startupinfo,
                    creationflags=subprocess.CREATE_NO_WINDOW
                )
                
                time.sleep(3)
                webbrowser.open("http://localhost:8501", new=2, autoraise=True)
                return process
                
            except Exception as e:
                print(f"启动失败: {str(e)}")
                return None

        if __name__ == "__main__":
            process = None
            try:
                process = run_streamlit()
                if process:
                    while True:
                        if process.poll() is not None:
                            break
                        time.sleep(1)
            except KeyboardInterrupt:
                if process:
                    process.terminate()
            except Exception as e:
                print(f"运行时错误: {str(e)}")' > launcher.py

    - name: Create Streamlit config
      run: |
        mkdir .streamlit
        echo '[server]
        enableCORS = true
        enableXsrfProtection = true
        headless = true
        address = "localhost"
        port = 8501
        maxUploadSize = 200
        runOnSave = false
        
        [browser]
        serverAddress = "localhost"
        serverPort = 8501
        gatherUsageStats = false
        
        [theme]
        primaryColor = "#F63366"
        backgroundColor = "#FFFFFF"
        secondaryBackgroundColor = "#F0F2F6"
        textColor = "#262730"
        font = "sans serif"
        
        [runner]
        magicEnabled = false
        
        [client]
        showErrorDetails = true
        toolbarMode = "minimal"
        
        [logger]
        level = "error"' > .streamlit/config.toml

    - name: Build executable
      run: |
        pyinstaller --name="test" `
          --onefile `
          --add-data "main.py;." `
          --add-data ".streamlit/config.toml;.streamlit" `
          --hidden-import=streamlit `
          --hidden-import=streamlit.runtime.scriptrunner `
          --hidden-import=streamlit.runtime.runtime `
          --hidden-import=streamlit.runtime.caching `
          --hidden-import=streamlit.runtime.metrics `
          --hidden-import=streamlit.runtime.secrets `
          --hidden-import=plotly `
          --hidden-import=numpy `
          --hidden-import=pandas `
          --noconsole `
          --windowed `
          launcher.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: test
        path: dist/test.exe
        if-no-files-found: error
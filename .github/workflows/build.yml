name: Build and Deploy

on:
  push:
    branches:
      - test  # 触发构建的分支
  pull_request:
    branches:
      - test  # 触发构建的分支

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 环境构建 .exe 文件

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3  # 克隆你的仓库

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'  # 你使用的 Python 版本，可以修改为适合你的版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # 安装 requirements.txt 中列出的依赖，包括 streamlit

    - name: Install PyInstaller
      run: pip install pyinstaller  # 安装 PyInstaller

    - name: Build .exe using PyInstaller
      run: pyinstaller --onefile --hidden-import=streamlit main.py  # 打包你的 Python 脚本为 .exe 文件

    - name: Upload .exe as artifact
      uses: actions/upload-artifact@v4  # 将 .exe 文件上传为 artifact
      with:
        name: built-exe
        path: dist/main.exe  # 你的 .exe 文件路径